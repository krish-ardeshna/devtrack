[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devtrack-cli"
version = "0.1.0"
description = "A lightweight, local-first task tracking CLI with a public plan-vs-execution dashboard."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Krish Ardeshna" }
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings",
    "python-dotenv",
]
dev = [
    "pytest"
]

[project.scripts]
devtrack = "cli:main"

[tool.setuptools]
py-modules = ["cli", "task", "storage", "status", "priority"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]